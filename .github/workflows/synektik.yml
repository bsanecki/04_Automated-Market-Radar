name: Synektik News Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check-synektik:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Synektik monitor
        env:
          SYNEKTIK_WEBHOOK: ${{ secrets.SYNEKTIK_WEBHOOK }}
        run: |
          python scripts/synektik.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synektik_state.json
          git diff --cached --quiet || git commit -m "Update Synektik news state"
          git push
