name: Synektik News Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: synektik-monitor
  cancel-in-progress: false

jobs:
  check-synektik:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 feedparser

      - name: Run Synektik monitor
        env:
          SYNEKTIK_WEBHOOK: ${{ secrets.SYNEKTIK_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/synektik.py
