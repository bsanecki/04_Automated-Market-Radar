name: General News Monitor
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
concurrency:
  group: general-news-monitor
  cancel-in-progress: false
jobs:
  check-general-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
      - name: Run General News monitor
        env:
          GENERAL_NEWS_WEBHOOK: ${{ secrets.GENERAL_NEWS_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/general_news.py
